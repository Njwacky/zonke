name: CI

# Stage 0 quality gate ("zonke improvement" §4.3): every push/PR must pass
# syntax checks, the game-rule + entry-point test suite, multiplayer
# integration tests, and a dependency security audit.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gates:
    name: Syntax · Tests · Audit (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci

      - name: JavaScript syntax check
        run: npm run check

      - name: Game-rule, entry-point & multiplayer integration tests
        run: npm test

      - name: Dependency security audit (high/critical fail the build)
        run: npm audit --audit-level=high
